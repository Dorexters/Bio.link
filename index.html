<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page with Animated Profile Picture</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="profile-section">
            <img src="https://i.imgur.com/zn2qw8R.gif" alt="Foto Profil" class="profile-img">
            <h1 class="title">NAMA</h1>
        </div>
        <div class="button-section">
            <button id="aboutMeButton" class="btn" aria-expanded="false">About Me</button>
            <button id="connectButton" class="btn" aria-expanded="false">Connect with Me</button>
        </div>
        <div id="aboutMeContent" class="hidden-content">
            <p>Hobi saya meliputi membaca manga, menonton anime, dan menggambar. Saya juga tertarik pada karya sastra dan psikologi.</p>
        </div>
        <div id="connectContent" class="hidden-content">
            <a href="https://instagram.com" class="social-btn" target="_blank">Instagram</a>
            <a href="https://twitter.com" class="social-btn" target="_blank">Twitter</a>
            <a href="https://discord.com" class="social-btn" target="_blank">Discord</a>
            <a href="mailto:email@example.com" class="social-btn">Email</a>
            <a href="https://wa.me/1234567890" class="social-btn" target="_blank">WhatsApp</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
