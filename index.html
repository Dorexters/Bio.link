<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal Profile Page with animations, toggleable content sections, and social media links.">
    <meta name="keywords" content="Profile Page, About Me, Social Media, Animation, Web Design">
    <meta name="author" content="Nama Anda">
    <title>Profile Page with Animated Profile Picture</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="profile-section">
            <h2 class="welcome-text">WELCOME</h2>

        </div>
        <div id="aboutMeContent" class="hidden-content">
            <p>Hobi menonton anime, suka membaca manga dan light novel, kadang juga suka main game, punya banyak waifu, ada ayanami rei dari neon genesis evangelion, makise kurisu dari steins gate, ryo yamada dari bochi the rock, </p>
        </div>
        <div id="connectContent" class="hidden-content">
            <a href="https://www.instagram.com/aonttrxs?igsh=MTl5ajE2Z2NmMm05Zw==" class="social-btn" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a href="https://twitter.com" class="social-btn" target="_blank" rel="noopener noreferrer">Twitter</a>
            <a href="https://discord.com" class="social-btn" target="_blank" rel="noopener noreferrer">Discord</a>
            <a href="mailto:email@example.com" class="social-btn">Email</a>
            <a href="https://wa.me/1234567890" class="social-btn" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
