<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page with Animated Profile Picture</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="profile-section">
            <!-- Foto Profil dengan GIF -->
            <img src="https://i.imgur.com/zn2qw8R.gif" alt="Foto Profil" class="profile-img">
            <h1 class="title">Nama Kamu</h1>
        </div>
        <div class="button-section">
            <button id="aboutMeButton" class="btn">About Me</button>
            <button id="connectButton" class="btn">Connect with Me</button>
        </div>
        <div id="aboutMeContent" class="hidden-content">
            <p>Hobi saya meliputi membaca manga, menonton anime, dan menggambar. Saya juga tertarik pada karya sastra dan psikologi.</p>
        </div>
        <div id="connectContent" class="hidden-content">
            <button class="social-btn">Instagram</button>
            <button class="social-btn">Twitter</button>
            <button class="social-btn">Discord</button>
            <button class="social-btn">Email</button>
            <button class="social-btn">WhatsApp</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
